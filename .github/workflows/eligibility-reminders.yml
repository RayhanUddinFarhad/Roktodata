# Asks the API to text donors who can donate again (see roktodata-backend/controllers/jobController.js).
# Switched off for now: it only runs by hand from the Actions tab. To run it daily, set JOBS_SECRET
# on Render and as a repository secret, and put back the schedule below.
name: Eligibility reminders

on:
  # schedule:
  #   - cron: "0 4 * * *" # 04:00 UTC = 10:00 in Bangladesh
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count, send nothing"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send reminders
        env:
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
          QUERY: ${{ inputs.dry_run && '?dryRun=1' || '' }}
        run: |
          # The free Render server may be asleep: wake it first, then call the job.
          curl -sS --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 https://roktodata-wlgx.onrender.com/api/health
          echo
          curl -sS --fail-with-body --retry 3 --retry-delay 20 --retry-all-errors --max-time 300 -X POST \
            -H "Authorization: Bearer $JOBS_SECRET" \
            "https://roktodata-wlgx.onrender.com/api/jobs/eligibility-reminders$QUERY"
